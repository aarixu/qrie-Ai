<style>
        body {
            /* Pattern for visual interest without noise */
            background-image: radial-gradient(#e0e3e5 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #f7f9fb;
        }
        
        .answer-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
        }
        
        .answer-card:active {
            transform: scale(0.98);
        }

        .selected-card {
            box-shadow: 0px 4px 20px rgba(99, 102, 241, 0.15);
        }
        
        .unselected-card {
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.04);
        }
        
        .unselected-card:hover {
            box-shadow: 0px 4px 12px rgba(99, 102, 241, 0.08);
            transform: translateY(-2px);
        }
        
        /* Progress bar animation */
        .progress-fill {
            background: linear-gradient(45deg, #4648d4 25%, #6063ee 25%, #6063ee 50%, #4648d4 50%, #4648d4 75%, #6063ee 75%, #6063ee 100%);
            background-size: 20px 20px;
            animation: moveStripes 2s linear infinite;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 20px 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface md:hidden">
<!-- TopAppBar -->
<header class="w-full top-0 bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-margin-mobile h-16 w-full max-w-7xl mx-auto sticky z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors scale-95 active:scale-90 transition-transform text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="flex-1 px-4 max-w-[200px]">
<div class="h-3 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full w-3/8 progress-fill rounded-full" style="width: 37.5%;"></div>
</div>
</div>
<div class="flex items-center gap-1 font-headline-md text-headline-md text-secondary-container bg-secondary-container/10 px-3 py-1 rounded-full">
<span class="font-bold text-[18px]">5</span>
<span>🔥</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-margin-mobile py-stack-md gap-stack-md overflow-y-auto pb-24">
<!-- Header Section -->
<div class="flex flex-col gap-stack-sm">
<div class="inline-flex items-center self-start px-3 py-1 bg-surface-container text-on-surface-variant rounded-full font-label-sm text-label-sm uppercase tracking-wider">
                QUESTION 3 OF 8
            </div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
                Which of these processes describes how plants make their own food using sunlight?
            </h1>
<button class="inline-flex items-center gap-2 self-start text-primary hover:text-primary-container font-label-md text-label-md transition-colors mt-2">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 0;">front_hand</span>
                Ask the tutor
            </button>
</div>
<!-- Answers Section -->
<div class="flex flex-col gap-stack-sm">
<!-- Card A -->
<button class="answer-card unselected-card w-full flex items-center p-4 bg-surface-container-lowest rounded-[24px] border border-transparent">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-surface-container text-on-surface font-headline-md text-headline-md">
                    A
                </div>
<div class="ml-4 text-left font-body-lg text-body-lg text-on-surface flex-1">
                    Respiration
                </div>
</button>
<!-- Card B (Selected) -->
<button class="answer-card selected-card w-full flex items-center p-4 bg-primary-fixed border-2 border-primary rounded-[24px]">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-primary text-on-primary font-headline-md text-headline-md">
                    B
                </div>
<div class="ml-4 text-left font-body-lg text-body-lg text-on-primary-fixed-variant flex-1 font-medium">
                    Photosynthesis
                </div>
</button>
<!-- Card C -->
<button class="answer-card unselected-card w-full flex items-center p-4 bg-surface-container-lowest rounded-[24px] border border-transparent">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-surface-container text-on-surface font-headline-md text-headline-md">
                    C
                </div>
<div class="ml-4 text-left font-body-lg text-body-lg text-on-surface flex-1">
                    Transpiration
                </div>
</button>
<!-- Card D -->
<button class="answer-card unselected-card w-full flex items-center p-4 bg-surface-container-lowest rounded-[24px] border border-transparent">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-surface-container text-on-surface font-headline-md text-headline-md">
                    D
                </div>
<div class="ml-4 text-left font-body-lg text-body-lg text-on-surface flex-1">
                    Digestion
                </div>
</button>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md p-margin-mobile border-t border-outline-variant/30">
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-headline-md text-headline-md flex items-center justify-center gap-2 shadow-[0px_4px_0px_#2f2ebe] active:shadow-none active:translate-y-[4px] transition-all">
            Check
        </button>
</div>
