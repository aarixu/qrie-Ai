<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Search - K-12 Learning App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#fffbff",
                        "surface-dim": "#d8dadc",
                        "on-background": "#191c1e",
                        "surface-container-high": "#e6e8ea",
                        "secondary": "#855300",
                        "surface-container-low": "#f2f4f6",
                        "inverse-surface": "#2d3133",
                        "on-tertiary": "#ffffff",
                        "primary": "#4648d4",
                        "on-secondary-fixed-variant": "#653e00",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-variant": "#e0e3e5",
                        "surface-container": "#eceef0",
                        "outline": "#767586",
                        "surface-tint": "#494bd6",
                        "surface-bright": "#f7f9fb",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#ffddb8",
                        "on-surface-variant": "#464554",
                        "background": "#f7f9fb",
                        "outline-variant": "#c7c4d7",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#ffb783",
                        "secondary-fixed-dim": "#ffb95f",
                        "on-secondary-fixed": "#2a1700",
                        "on-surface": "#191c1e",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#eff1f3",
                        "primary-fixed": "#e1e0ff",
                        "tertiary-fixed": "#ffdcc5",
                        "inverse-primary": "#c0c1ff",
                        "surface": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary-fixed": "#301400",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#fea619",
                        "on-primary-fixed": "#07006c",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#b55d00",
                        "on-tertiary-fixed-variant": "#703700",
                        "primary-container": "#6063ee",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "tertiary": "#904900",
                        "on-secondary-container": "#684000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-padding": "24px",
                        "base-unit": "8px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "margin-mobile": "16px",
                        "stack-lg": "48px",
                        "margin-desktop": "32px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Lexend"],
                        "headline-xl": ["Quicksand"],
                        "headline-lg": ["Quicksand"],
                        "label-md": ["Lexend"],
                        "headline-lg-mobile": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "body-md": ["Lexend"],
                        "label-sm": ["Lexend"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8FAFC;
            background-image: radial-gradient(#e0e3e5 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .squishy-card {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        }
        .squishy-card:active {
            transform: scale(0.98);
            box-shadow: 0px 2px 10px rgba(99, 102, 241, 0.04);
        }
        .squishy-card:hover {
            transform: scale(1.02);
            box-shadow: 0px 8px 30px rgba(99, 102, 241, 0.12);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-lg min-h-screen pb-24 relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-background z-40">
<div class="flex items-center justify-between px-margin-mobile w-full py-4">
<button class="scale-95 active:scale-90 transition-transform hover:bg-surface-container-high p-2 rounded-full text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Search</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-margin-mobile pt-stack-sm flex flex-col gap-stack-md">
<!-- Search Bar -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">search</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-surface-container-lowest border-none rounded-xl text-body-md font-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary shadow-[0px_4px_20px_rgba(99,102,241,0.08)] transition-all" placeholder="Search lessons and topics" type="text"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Filter Chips -->
<div class="flex overflow-x-auto gap-3 py-2 hide-scrollbar -mx-margin-mobile px-margin-mobile snap-x">
<button class="snap-start whitespace-nowrap px-6 py-2 rounded-full font-label-md text-label-md bg-primary text-on-primary shadow-sm border-b-2 border-primary-container squishy-card active:border-b-0 active:translate-y-[2px]">All</button>
<button class="snap-start whitespace-nowrap px-6 py-2 rounded-full font-label-md text-label-md bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors squishy-card border border-outline-variant">Science</button>
<button class="snap-start whitespace-nowrap px-6 py-2 rounded-full font-label-md text-label-md bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors squishy-card border border-outline-variant">Maths</button>
<button class="snap-start whitespace-nowrap px-6 py-2 rounded-full font-label-md text-label-md bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors squishy-card border border-outline-variant">English</button>
</div>
<!-- Results List -->
<div class="flex flex-col gap-stack-sm">
<!-- Result Card 1 -->
<div class="bg-surface-container-lowest rounded-[24px] p-4 flex items-center gap-4 shadow-[0px_4px_20px_rgba(99,102,241,0.08)] squishy-card cursor-pointer">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-inner">
<span class="material-symbols-outlined text-on-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-headline-md text-[18px] leading-6 font-bold text-on-surface truncate">Heart &amp; Circulation</h3>
<p class="font-body-md text-[14px] text-on-surface-variant truncate">Class 10 - Science</p>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</div>
<!-- Result Card 2 -->
<div class="bg-surface-container-lowest rounded-[24px] p-4 flex items-center gap-4 shadow-[0px_4px_20px_rgba(99,102,241,0.08)] squishy-card cursor-pointer opacity-80">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">schedule</span>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-headline-md text-[18px] leading-6 font-bold text-on-surface truncate">Chemical Reactions</h3>
<p class="font-body-md text-[14px] text-outline truncate">Chemistry - coming soon</p>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</div>
<!-- Result Card 3 -->
<div class="bg-surface-container-lowest rounded-[24px] p-4 flex items-center gap-4 shadow-[0px_4px_20px_rgba(99,102,241,0.08)] squishy-card cursor-pointer">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-inner">
<span class="material-symbols-outlined text-on-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-headline-md text-[18px] leading-6 font-bold text-on-surface truncate">Linear Equations</h3>
<p class="font-body-md text-[14px] text-on-surface-variant truncate">Class 9 - Maths</p>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center py-2 px-margin-mobile bg-surface-container-lowest rounded-t-xl shadow-[0px_-4px_20px_rgba(99,102,241,0.08)] z-50">
<!-- Home Inactive -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all scale-105 active:scale-95 duration-200 w-16 h-16 rounded-xl">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Search Active -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 hover:bg-surface-container-high transition-all scale-105 active:scale-95 duration-200">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-label-sm text-label-sm mt-1">Search</span>
</button>
<!-- Progress Inactive -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all scale-105 active:scale-95 duration-200 w-16 h-16 rounded-xl">
<span class="material-symbols-outlined">leaderboard</span>
<span class="font-label-sm text-label-sm mt-1">Progress</span>
</button>
<!-- Profile Inactive -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all scale-105 active:scale-95 duration-200 w-16 h-16 rounded-xl">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</nav>
</body></html>
