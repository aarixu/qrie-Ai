<style>
        .progress-ring__circle {
            transition: stroke-dashoffset 1s ease-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        .bg-pattern-dots {
            background-image: radial-gradient(circle at center, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
            background-size: 16px 16px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative overflow-x-hidden bg-pattern-dots md:hidden">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-surface shadow-sm z-40">
<div class="flex justify-between items-center px-margin-mobile py-base-unit w-full max-w-[1120px] mx-auto">
<div class="flex items-center gap-3">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary">
                 Results
             </div>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</div>
</header>
<main class="flex-grow flex flex-col px-margin-mobile pt-stack-lg pb-24">
<!-- Score Section -->
<section class="flex flex-col items-center justify-center mb-stack-lg">
<div class="relative w-40 h-40 flex items-center justify-center mb-stack-md">
<svg class="w-full h-full absolute inset-0" viewbox="0 0 120 120">
<circle class="text-surface-variant" cx="60" cy="60" fill="transparent" r="54" stroke="currentColor" stroke-width="12"></circle>
<!-- 75% of circumference (2 * pi * 54 = ~339.29) -->
<circle class="progress-ring__circle text-primary" cx="60" cy="60" fill="transparent" r="54" stroke="currentColor" stroke-dasharray="339.29" stroke-dashoffset="84.82" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<div class="flex flex-col items-center justify-center z-10">
<span class="font-headline-xl text-headline-xl text-primary">6<span class="text-on-surface-variant text-body-lg font-body-lg">/8</span></span>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 text-center">Nicely done!</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-stack-md">You're mastering this chapter.</p>
<div class="flex gap-4">
<div class="bg-surface-container-lowest px-4 py-2 rounded-full shadow-[0px_4px_20px_rgba(99,102,241,0.05)] border border-outline-variant/20 flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-label-md text-label-md text-on-surface">Time 4m 20s</span>
</div>
<div class="bg-secondary-fixed px-4 py-2 rounded-full shadow-[0px_4px_20px_rgba(99,102,241,0.05)] border border-outline-variant/20 flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label-md text-label-md text-on-secondary-container">Streak 5 correct</span>
</div>
</div>
</section>
<!-- Worth another look -->
<section class="flex flex-col gap-stack-sm mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Worth another look</h2>
<!-- Card 1 -->
<div class="bg-surface-container-lowest p-card-padding rounded-2xl shadow-[0px_4px_20px_rgba(99,102,241,0.08)] flex items-start gap-4 hover:scale-[1.02] transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-error">close</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-md text-[18px] leading-6 text-on-surface mb-1">Heart Chambers</h3>
<p class="font-body-md text-[14px] leading-5 text-on-surface-variant mb-3">Mixed up Atrium and Ventricle</p>
<button class="bg-primary-container text-on-primary-container font-label-md text-label-md px-4 py-1.5 rounded-full hover:opacity-90 transition-opacity">
                        Review
                    </button>
</div>
</div>
<!-- Card 2 -->
<div class="bg-surface-container-lowest p-card-padding rounded-2xl shadow-[0px_4px_20px_rgba(99,102,241,0.08)] flex items-start gap-4 hover:scale-[1.02] transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-error">close</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-md text-[18px] leading-6 text-on-surface mb-1">Blood Types</h3>
<p class="font-body-md text-[14px] leading-5 text-on-surface-variant mb-3">Review Universal Donor</p>
<button class="bg-primary-container text-on-primary-container font-label-md text-label-md px-4 py-1.5 rounded-full hover:opacity-90 transition-opacity">
                        Review
                    </button>
</div>
</div>
</section>
</main>
<!-- Bottom Actions (Sticky) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant/20 p-margin-mobile pb-8 flex flex-col gap-3 z-50">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl shadow-sm border-b-2 border-on-primary-fixed-variant active:translate-y-[2px] active:border-b-0 active:mb-[2px] transition-all">
            Continue
        </button>
<button class="w-full bg-transparent text-primary font-label-md text-label-md py-4 rounded-xl hover:bg-primary/5 transition-colors">
            Retry quiz
        </button>
</div>
<script>
        // Trigger progress ring animation on load
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.querySelector('.progress-ring__circle');
            if(circle) {
                // start at 0
                circle.style.strokeDashoffset = '339.29';
                setTimeout(() => {
                    // animate to 75%
                    circle.style.strokeDashoffset = '84.82';
                }, 100);
            }
        });
    </script>
</body></html>
