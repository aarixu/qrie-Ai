<!DOCTYPE html>

        .pattern-dots {
            background-image: radial-gradient(var(--tw-colors-outline-variant) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: 0 0;
            opacity: 0.15;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased relative min-h-screen pb-[80px]">
<!-- Dot Pattern Background -->
<div class="fixed inset-0 pattern-dots pointer-events-none z-0"></div>
<div class="relative z-10 w-full max-w-md mx-auto">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-margin-mobile py-4 z-20">
<h1 class="font-headline-md text-headline-md font-bold text-primary">Profile</h1>
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container shadow-[0px_4px_20px_rgba(99,102,241,0.08)]">

</header>
<main class="px-margin-mobile flex flex-col gap-stack-md mt-4">

<div class="w-16 h-16 rounded-full overflow-hidden shrink-0 border-2 border-primary-container">
<img alt="Rahul Sharma Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1Xb4Oal8t8tAWY4OlBcUBkDsI74v8s_5NAVhYjrhjL-WaxuRAhUP-OJMZ-QiIL45CpjseThgeleAALOlUYLNRw5rc5qSPsUSrXssa4Fp74iE0-D9pSMXVeoIz4-MEj_wrNlqY3QsC-ZFFYvAePtLPEqSPoGDzo4-TlTzfqTeic3fzEG5Vig0iMZXnwSIwKBMjmYcjav4ocD7Is7jaRRio1vVXj5KbtabN-ZeuzAPr2eM9q-wzR7MzLVxg"/>
</div>
<div class="flex flex-col">

<p class="font-body-md text-body-md text-on-surface-variant">Class 10 - Science, Maths, English</p>
</div>
</section>
<!-- My Class Section -->

<h3 class="font-label-sm text-label-sm uppercase text-outline tracking-wider">MY CLASS</h3>
<div class="flex gap-2 overflow-x-auto pb-2 -mx-margin-mobile px-margin-mobile snap-x scrollbar-hide">
<button class="snap-start shrink-0 px-4 py-2 rounded-full font-label-md text-label-md bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors shadow-sm">Class 6</button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full font-label-md text-label-md bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors shadow-sm">Class 7</button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full font-label-md text-label-md bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors shadow-sm">Class 8</button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full font-label-md text-label-md bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors shadow-sm">Class 9</button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full font-label-md text-label-md bg-primary text-on-primary shadow-[0px_4px_12px_rgba(96,99,238,0.3)] border-b-2 border-primary-fixed-dim transition-transform duration-200 hover:scale-[1.02]">Class 10</button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full font-label-md text-label-md bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors shadow-sm">Class 11</button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full font-label-md text-label-md bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors shadow-sm">Class 12</button>
</div>
</section>

<div class="flex items-center gap-4 text-on-surface">
<span aria-hidden="true" class="material-symbols-outlined text-primary" data-icon="book">book</span>
<span class="font-body-md text-body-md group-hover:text-primary transition-colors">Subjects</span>
</div>
<span aria-hidden="true" class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>

<button class="w-full bg-surface-container-lowest rounded-[16px] p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(99,102,241,0.08)] hover:scale-[1.01] transition-transform duration-200 active:scale-95 group">
<div class="flex items-center gap-4 text-on-surface">
<span aria-hidden="true" class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
<span class="font-body-md text-body-md group-hover:text-primary transition-colors">Notifications</span>
</div>
<span aria-hidden="true" class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full bg-surface-container-lowest rounded-[16px] p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(99,102,241,0.08)] hover:scale-[1.01] transition-transform duration-200 active:scale-95 group">

<span aria-hidden="true" class="material-symbols-outlined text-primary" data-icon="download">download</span>

</button>
<button class="w-full bg-surface-container-lowest rounded-[16px] p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(99,102,241,0.08)] hover:scale-[1.01] transition-transform duration-200 active:scale-95 group">

<span aria-hidden="true" class="material-symbols-outlined text-primary" data-icon="help">help</span>
<span class="font-body-md text-body-md group-hover:text-primary transition-colors">Help and support</span>
</div>
<span aria-hidden="true" class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
</section>

<section class="mt-4 mb-stack-lg">
<button class="w-full py-4 px-6 rounded-full border-2 border-error text-error font-label-md text-label-md uppercase tracking-wider hover:bg-error-container hover:scale-[1.02] active:scale-95 transition-all duration-200 shadow-sm">

<span aria-hidden="true" class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-label-sm text-label-sm mt-1">Search</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity p-2" href="#">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="insights">insights</span>

</a>

            display: none;
