<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1411" />
    <title>AI Tutor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Kalam: chalk handwriting, covers Devanagari too. Baloo 2: warm rounded UI text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Kalam:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0d1411; }
      button { font: inherit; }
      /* Keyboard users get a chalk-yellow ring; mouse users get none. */
      :focus-visible { outline: 2px solid #f5c84c; outline-offset: 2px; border-radius: 4px; }
      :focus:not(:focus-visible) { outline: none; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
