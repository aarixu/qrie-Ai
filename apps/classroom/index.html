<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fb" />
    <!-- The one place the product name is a literal: HTML cannot import.
         apps/classroom/src/brand.ts is the source of truth — rename there
         first, then mirror it here and in content/manifest.webmanifest. -->
    <title>Curie</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400..700&family=Lexend:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <!-- display=block, not swap: while this font loads, swap would paint every
         icon as its raw ligature name ("person", "play_arrow") in a text face.
         Icons are the one place a moment of invisible beats a moment of wrong. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Before first paint, or a dark-theme student sees a white flash on every
         load. Deliberately duplicates src/lib/theme.ts rather than importing
         it: the module graph has not loaded yet at this point. The store key
         and the rule must stay in step with that file. -->
    <script>
      try {
        var pref = JSON.parse(localStorage.getItem('ai-tutor:preferences') || '{}');
        var theme = pref.theme || 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101418');
        }
      } catch (e) {
        /* A blocked or broken localStorage just means the light room. */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
