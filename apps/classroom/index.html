<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f0" />
    <!-- The one place the product name is a literal: HTML cannot import.
         apps/classroom/src/brand.ts is the source of truth — rename there
         first, then mirror it here and in content/manifest.webmanifest. -->
    <title>Qrie</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- display=block, not swap: while this font loads, swap would paint every
         icon as its raw ligature name ("person", "play_arrow") in a text face.
         Icons are the one place a moment of invisible beats a moment of wrong. -->
  </head>
  <body>
    <!-- Before first paint, or a dark-theme student sees a white flash on every
         load. Deliberately duplicates src/lib/theme.ts rather than importing
         it: the module graph has not loaded yet at this point. The store key
         and the rule must stay in step with that file.
         The drift this comment used to warn about is GONE: theme.ts CHROME is
         #faf7f0 / #141318, the same pair as below and the same as the
         background token in theme.css, so applyTheme re-stamping the meta at
         boot no longer overwrites these with a stale value. theme.css stays
         the source of truth — brand.test.ts and theme.test.ts pin THIS file
         to it, so a colour moves in theme.css first, never here. -->
    <script>
      try {
        var pref = JSON.parse(localStorage.getItem('ai-tutor:preferences') || '{}');
        var theme = pref.theme || 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141318');
        }
      } catch (e) {
        /* A blocked or broken localStorage just means the light room. */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
