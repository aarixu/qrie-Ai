<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- THE COMMENT LIVES INSIDE <svg>, AND THAT IS LOAD-BEARING.
       libvips sniffs the first bytes of a file to decide what it is, so an SVG
       that opens with a long comment is not recognised as one: the <svg> tag
       falls outside the window and make-app-icons.mjs dies with "Input file
       contains unsupported image format". The old comment was short enough to
       get away with it. Keep the prose in here and the length stops mattering.

       The Curie mark from apps/classroom/src/ui/Logo.tsx. The geometry below
       is the component's 32-unit drawing placed by one transform, so the icon
       and the in-app logo can never drift; only the scale factor differs.

       TWO INKS, which is the whole brand: blue #0B5FD9 on an amber #FFC85C
       tile. The second orbit used to be the fluoro pink plate — that made pink
       half the mark and so half the brand, against law 1, which says fluoro is
       a ground and never the thing you read. (Its hex is deliberately not
       written here: brand.test.ts asserts this file does not contain it, and a
       mention in prose would satisfy that assertion as readily as a stroke.)

       The amber is the primary-fixed token and the marketing site's hero
       colour, so the icon a student installs is the same brand as the page
       they came from. Amber never appears without a keyline (law 3), so the
       tile carries an ink one: 12px at 512 is the 2.5px keyline at the ~100px
       a launcher renders. -->
  <rect width="512" height="512" rx="112" fill="#FFC85C"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#17171D" stroke-width="12"/>
  <g transform="translate(256 256) scale(13.5)">
    <g fill="none" stroke-width="2.4" stroke="#0B5FD9">
      <ellipse rx="14" ry="6.2" transform="rotate(45)"/>
      <ellipse rx="14" ry="6.2" transform="rotate(-45)"/>
    </g>
    <circle r="4" fill="#17171D"/>
    <!-- Blue on amber is 3.7:1 — enough for a shape, and this one is small, so
         it keeps the ink keyline the pink electron needed for the same reason. -->
    <circle cx="9.9" cy="-9.9" r="2.2" fill="#0B5FD9" stroke="#17171D" stroke-width="1.2"/>
  </g>
</svg>
