<!-- The Curie mark from apps/classroom/src/ui/Logo.tsx. The geometry below is
     the component's 32-unit drawing placed by one transform, so the icon and the
     in-app logo can never drift; only the scale factor differs.

     RISO POP inks: the two orbits are the two riso plates — blue #0B5FD9 and
     fluoro pink #FF48A0 — overprinted on a yellow #FFD21E tile. Yellow never
     appears without a keyline (law 3), so the tile carries an ink one: 12px at
     512 is the 2.5px keyline at the ~100px a launcher actually renders. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#FFD21E"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#17171D" stroke-width="12"/>
  <g transform="translate(256 256) scale(13.5)">
    <g fill="none" stroke-width="2.4">
      <ellipse rx="14" ry="6.2" transform="rotate(45)" stroke="#0B5FD9"/>
      <ellipse rx="14" ry="6.2" transform="rotate(-45)" stroke="#FF48A0"/>
    </g>
    <circle r="4" fill="#17171D"/>
    <!-- Pink on yellow is a hue change, not a contrast one, so the electron
         gets its own keyline. -->
    <circle cx="9.9" cy="-9.9" r="2.2" fill="#FF48A0" stroke="#17171D" stroke-width="1.2"/>
  </g>
</svg>
