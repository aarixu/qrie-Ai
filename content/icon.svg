<!-- The Curie mark from apps/classroom/src/ui/Logo.tsx. The geometry below is
     the component's 32-unit drawing placed by one transform, so the icon and the
     in-app logo can never drift; only the scale factor differs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#4648d4"/>
  <g transform="translate(256 256) scale(13.5)">
    <g fill="none" stroke="#ffffff" stroke-width="2.4">
      <ellipse rx="14" ry="6.2" transform="rotate(45)"/>
      <ellipse rx="14" ry="6.2" transform="rotate(-45)"/>
    </g>
    <circle r="4" fill="#ffffff"/>
    <circle cx="9.9" cy="-9.9" r="2.2" fill="#ffffff"/>
  </g>
</svg>
