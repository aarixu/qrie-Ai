<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <g id="pulmonary_loop">
    <path d="M 430 230 L 430 170 C 430 140 370 120 370 90" fill="none" stroke="var(--pulmonary-blue, #2563EB)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 430 230 L 430 170 C 430 140 370 120 370 90" class="curie-flow" fill="none" stroke="var(--pulmonary-blue-flow, #93C5FD)" stroke-width="8" stroke-dasharray="16 14" stroke-linecap="round"/>
    <path d="M 630 90 C 630 120 570 140 570 170 L 570 230" fill="none" stroke="var(--pulmonary-red, #DC2626)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 630 90 C 630 120 570 140 570 170 L 570 230" class="curie-flow" fill="none" stroke="var(--pulmonary-red-flow, #FCA5A5)" stroke-width="8" stroke-dasharray="16 14" stroke-linecap="round"/>
    <polygon points="370,125 360,145 380,145" fill="var(--pulmonary-blue, #1D4ED8)"/>
    <polygon points="570,185 560,165 580,165" fill="var(--pulmonary-red, #B91C1C)"/>
  </g>

  <g id="systemic_loop">
    <path d="M 570 390 L 570 450 C 570 480 630 500 630 530" fill="none" stroke="var(--systemic-red, #DC2626)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 570 390 L 570 450 C 570 480 630 500 630 530" class="curie-flow" fill="none" stroke="var(--systemic-red-flow, #FCA5A5)" stroke-width="8" stroke-dasharray="16 14" stroke-linecap="round"/>
    <path d="M 370 530 C 370 500 430 480 430 450 L 430 390" fill="none" stroke="var(--systemic-blue, #2563EB)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 370 530 C 370 500 430 480 430 450 L 430 390" class="curie-flow" fill="none" stroke="var(--systemic-blue-flow, #93C5FD)" stroke-width="8" stroke-dasharray="16 14" stroke-linecap="round"/>
    <polygon points="630,475 620,455 640,455" fill="var(--systemic-red, #B91C1C)"/>
    <polygon points="430,435 420,455 440,455" fill="var(--systemic-blue, #1D4ED8)"/>
  </g>

  <g id="heart">
    <rect x="350" y="210" width="300" height="200" rx="36" fill="var(--heart-muscle, #CBD5E1)" stroke="var(--heart-border, #475569)" stroke-width="8" stroke-linejoin="round"/>
    
    <rect x="365" y="225" width="125" height="80" rx="16" fill="var(--atrium-right, #93C5FD)" stroke="var(--chamber-border, #1E40AF)" stroke-width="4"/>
    <rect x="365" y="315" width="125" height="80" rx="16" fill="var(--ventricle-right, #60A5FA)" stroke="var(--chamber-border, #1E40AF)" stroke-width="4"/>
    
    <rect x="510" y="225" width="125" height="80" rx="16" fill="var(--atrium-left, #FCA5A5)" stroke="var(--chamber-border, #991B1B)" stroke-width="4"/>
    <rect x="510" y="315" width="125" height="80" rx="16" fill="var(--ventricle-left, #F87171)" stroke="var(--chamber-border, #991B1B)" stroke-width="4"/>
    
    <line x1="500" y1="210" x2="500" y2="410" stroke="var(--heart-septum, #475569)" stroke-width="10"/>
    <line x1="350" y1="310" x2="650" y2="310" stroke="var(--heart-septum, #475569)" stroke-width="6"/>

    <path d="M 427 298 L 427 322" stroke="var(--valve-blue, #1E3A8A)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="427,325 420,312 434,312" fill="var(--valve-blue, #1E3A8A)"/>

    <path d="M 573 298 L 573 322" stroke="var(--valve-red, #7F1D1D)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="573,325 566,312 580,312" fill="var(--valve-red, #7F1D1D)"/>

    <circle cx="500" cy="310" r="14" fill="var(--heart-core, #FFFFFF)" stroke="var(--heart-border, #475569)" stroke-width="4"/>
  </g>

  <g id="lungs">
    <path d="M 330 50 C 270 50 250 90 250 125 C 250 155 280 170 340 170 C 370 170 390 155 390 130 C 390 75 365 50 330 50 Z" fill="var(--lung-bg, #FEE2E2)" stroke="var(--lung-border, #FDA4AF)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 670 50 C 730 50 750 90 750 125 C 750 155 720 170 660 170 C 630 170 610 155 610 130 C 610 75 635 50 670 50 Z" fill="var(--lung-bg, #FEE2E2)" stroke="var(--lung-border, #FDA4AF)" stroke-width="6" stroke-linejoin="round"/>
    
    <rect x="420" y="45" width="160" height="90" rx="20" fill="var(--capillary-lung-bg, #EDE9FE)" stroke="var(--lung-border, #C4B5FD)" stroke-width="4"/>
    
    <path d="M 370 90 C 410 70 450 70 500 90 C 550 110 590 110 630 90" fill="none" stroke="var(--pulmonary-capillaries, #8B5CF6)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 370 110 C 410 90 450 90 500 110 C 550 130 590 130 630 110" fill="none" stroke="var(--pulmonary-capillaries, #8B5CF6)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 370 70 C 410 50 450 50 500 70 C 550 90 590 90 630 70" fill="none" stroke="var(--pulmonary-capillaries, #8B5CF6)" stroke-width="6" stroke-linecap="round"/>
    
    <circle cx="310" cy="110" r="16" fill="var(--alveoli, #F43F5E)"/>
    <circle cx="340" cy="135" r="12" fill="var(--alveoli, #FB7185)"/>
    <circle cx="295" cy="135" r="10" fill="var(--alveoli, #FDA4AF)"/>
    
    <circle cx="690" cy="110" r="16" fill="var(--alveoli, #F43F5E)"/>
    <circle cx="660" cy="135" r="12" fill="var(--alveoli, #FB7185)"/>
    <circle cx="705" cy="135" r="10" fill="var(--alveoli, #FDA4AF)"/>
  </g>

  <g id="body_tissues">
    <rect x="250" y="480" width="500" height="100" rx="24" fill="var(--tissue-bg, #FEF3C7)" stroke="var(--tissue-border, #F59E0B)" stroke-width="6" stroke-linejoin="round"/>
    
    <rect x="270" y="498" width="50" height="64" rx="10" fill="var(--cell-fill, #FDE68A)" stroke="var(--cell-border, #D97706)" stroke-width="3"/>
    <circle cx="295" cy="530" r="8" fill="var(--cell-nucleus, #B45309)"/>
    
    <rect x="330" y="498" width="50" height="64" rx="10" fill="var(--cell-fill, #FDE68A)" stroke="var(--cell-border, #D97706)" stroke-width="3"/>
    <circle cx="355" cy="530" r="8" fill="var(--cell-nucleus, #B45309)"/>
    
    <rect x="620" y="498" width="50" height="64" rx="10" fill="var(--cell-fill, #FDE68A)" stroke="var(--cell-border, #D97706)" stroke-width="3"/>
    <circle cx="645" cy="530" r="8" fill="var(--cell-nucleus, #B45309)"/>
    
    <rect x="680" y="498" width="50" height="64" rx="10" fill="var(--cell-fill, #FDE68A)" stroke="var(--cell-border, #D97706)" stroke-width="3"/>
    <circle cx="705" cy="530" r="8" fill="var(--cell-nucleus, #B45309)"/>

    <path d="M 630 530 C 590 510 550 510 500 530 C 450 550 410 550 370 530" fill="none" stroke="var(--systemic-capillaries, #8B5CF6)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 630 510 C 590 490 550 490 500 510 C 450 530 410 530 370 510" fill="none" stroke="var(--systemic-capillaries, #8B5CF6)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 630 550 C 590 530 550 530 500 550 C 450 570 410 570 370 550" fill="none" stroke="var(--systemic-capillaries, #8B5CF6)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>