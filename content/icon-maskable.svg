<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- THE COMMENT LIVES INSIDE <svg> — see the note in icon.svg. libvips
       sniffs the first bytes to decide what a file is, so an SVG that opens
       with a long comment is not recognised as one.

       Maskable variant, which is ALSO the Android adaptive FOREGROUND layer:
       tools/bin/make-app-icons.mjs renders this same file 1:1. Two croppings
       apply and the smaller one wins. PWA maskable masks keep at least the
       central 80% circle (r=204.8 at 512); Android's adaptive pipeline shows
       only the central 72/108dp of the layer and guarantees nothing outside
       the 66/108dp safe circle — r=156.4 at 512. An earlier draft keylined the
       amber with a ring at r=220: inside every PWA mask, cropped off every real
       Android launcher — amber unbounded (law 3 broken) exactly where most
       students see the mark.

       So the keylined amber tile from icon.svg moves INSIDE the safe circle,
       corners included (corner reach = sqrt2 x (125 - 55) + 55 = 154 < 156.4),
       and the full bleed is paper, croppable without losing a law. Same two
       inks as icon.svg — blue on amber, no fluoro; the mask's edge is still
       not a keyline, the tile's stroked rect is. -->
  <rect width="512" height="512" fill="#FAF7F0"/>
  <rect x="131" y="131" width="250" height="250" rx="55" fill="#FFC85C"/>
  <rect x="136" y="136" width="240" height="240" rx="50" fill="none" stroke="#17171D" stroke-width="10"/>
  <g transform="translate(256 256) scale(6.6)">
    <g fill="none" stroke-width="2.4" stroke="#0B5FD9">
      <ellipse rx="14" ry="6.2" transform="rotate(45)"/>
      <ellipse rx="14" ry="6.2" transform="rotate(-45)"/>
    </g>
    <circle r="4" fill="#17171D"/>
    <!-- Blue on amber is 3.7:1 — enough for a shape, and this one is small, so
         it keeps the ink keyline the pink electron needed for the same reason. -->
    <circle cx="9.9" cy="-9.9" r="2.2" fill="#0B5FD9" stroke="#17171D" stroke-width="1.2"/>
  </g>
</svg>
