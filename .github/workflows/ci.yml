# The safety net the repo was built for.
#
# 1,691 tests that run only on one laptop are not a safety net for a codebase
# whose stated purpose is that a stranger can pick it up. Every push and every
# pull request runs the same three commands a developer runs, in the same
# order, and a red check is the only thing standing between a broken main and
# a student.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `ci` rather than `install`: the lockfile is the point, and a build
      # that quietly resolves a different tree is a build that proves nothing.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The build catches what tests cannot: a bundle that fails to compile,
      # and — since the keys came out of the browser — a secret that finds its
      # way back into it.
      - name: Production build
        run: npm run build

      - name: No secret may reach the bundle
        run: node tools/bin/check-bundle-secrets.mjs
